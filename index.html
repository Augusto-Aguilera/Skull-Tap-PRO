<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Tap PRO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="screen active" id="startScreen">
    <h1>💀 SKULL TAP PRO</h1>

    <button id="playBtn">JUGAR</button>
    <button onclick="switchScreen('shopScreen')">TIENDA</button>
    <button onclick="switchScreen('rankingScreen')">RANKING</button>
</div>

<div class="screen" id="gameScreen">
    <div id="gameArea"></div>
    <p>Puntos: <span id="score">0</span></p>
</div>

<div class="screen" id="shopScreen">
    <h2>TIENDA</h2>
    <p>💰 <span id="walletAmount">0</span></p>

    <div class="shop-grid">
        <button onclick="buySkin('var(--neon-magenta)', 0)">MAGENTA</button>
        <button onclick="buySkin('#00fbff', 500)">CYAN</button>
        <button onclick="buySkin('#ffcc00', 1000)">ORO</button>

        <!-- NUEVAS SKINS -->
        <button onclick="buySkin('#ff5500', 2000)">INFERNO</button>
        <button onclick="buySkin('#00aaff', 3500)">DIABLO</button>
        <button onclick="buySkin('#6a00ff', 5000)">MOLOCH</button>
        <button onclick="buySkin('#ffd700', 8000)">BAPHOMET</button>
        <button onclick="buySkin('rainbow', 12000)">ORULA</button>
    </div>

    <button onclick="goHome()">VOLVER</button>
</div>

<div class="screen" id="rankingScreen">
    <h2>RANKING</h2>
    <ul id="rankingList"></ul>
    <button onclick="goHome()">VOLVER</button>
</div>

<audio id="hitSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="buySound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
