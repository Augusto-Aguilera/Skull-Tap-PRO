<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skull Tap PRO</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="startScreen" class="screen active">
<h1 class="logo">💀 SKULL TAP PRO</h1>
<button id="playBtn" class="btn-giant">JUGAR</button>
</div>

<div id="gameScreen" class="screen">
<div class="status-bar">
<span>PTS: <b id="score">0</b></span>
<span>TIEMPO: <b id="time">15</b></span>
<span>🔥 <b id="combo">x1</b></span>
</div>

<div id="gameArea"></div>
</div>

<div id="gameOverScreen" class="screen">
<h2>FIN</h2>
<h3 id="finalScore"></h3>
<button id="restartBtn">REINTENTAR</button>
</div>

<script src="script.js"></script>

<script>
function switchScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id+"Screen").classList.add("active");
}
</script>

</body>
</html>
